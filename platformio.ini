; Unified PlatformIO build configuration for RadioMaster XR4 (ESP32-PICO-D4 + 2x Semtech LR1121)
[platformio]
src_dir = firmware
default_envs = radiomaster_xr4

[env:radiomaster_xr4]
platform = espressif32@6.9.0
board = pico32
framework = arduino
monitor_speed = 420000
upload_speed = 420000
build_src_filter =
    +<elrs/*.cpp>
    +<crsf/*.cpp>
    +<rnode/*.cpp>
    +<radio/lr1121_driver.cpp>
    +<src/xr4_main.cpp>
build_flags =
    -Wall
    -Wextra
    -O2
    -DTARGET_RADIOMASTER_XR4=1
    -Ifirmware
