# OpenOCD configuration for Seeed Studio XIAO nRF54L15 (CMSIS-DAPv2 SWD)

adapter driver cmsis-dap
cmsis_dap_backend usb_bulk
transport select swd
adapter speed 4000

set _CHIPNAME nrf54l
set _WORKAREASIZE 0x4000

swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x6ba02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0
cortex_m reset_config sysresetreq

set NRF54L_RRAMC_BASE 0x5004b000

proc nrf54l_flash_image { image_path } {
    global NRF54L_RRAMC_BASE
    reset halt
    # Enable RRAM writes (WRITE_ENABLE=1, WRITEBUFSIZE=1 line)
    mww [expr {$NRF54L_RRAMC_BASE + 0x500}] 0x101
    load_image $image_path
    # Commit write buffer
    mww [expr {$NRF54L_RRAMC_BASE + 0x008}] 1
    sleep 10
    verify_image $image_path
    # Disable RRAM writes
    mww [expr {$NRF54L_RRAMC_BASE + 0x500}] 0x000
    reset run
}
